# Protected brands. Domain labels feed look-alike checks. Aliases are display-name claims.
brands:
  - name: Microsoft
    domains: [microsoft.com, office.com, office365.com, microsoftonline.com]
    labels: [microsoft, office365]
    aliases: [microsoft, office 365, office365]
  - name: PayPal
    domains: [paypal.com]
    labels: [paypal]
    aliases: [paypal, pay pal]
  - name: Amazon
    domains: [amazon.com, amazon.co.uk]
    labels: [amazon]
    aliases: [amazon]
  - name: Apple
    domains: [apple.com, icloud.com]
    labels: [apple, icloud]
    aliases: [apple, icloud]
  - name: Google
    domains: [google.com, gmail.com, googlemail.com]
    labels: [google, gmail]
    aliases: [google]
  - name: Netflix
    domains: [netflix.com]
    labels: [netflix]
    aliases: [netflix]
  - name: Dropbox
    domains: [dropbox.com]
    labels: [dropbox]
    aliases: [dropbox]
  - name: Adobe
    domains: [adobe.com]
    labels: [adobe]
    aliases: [adobe]
  - name: DocuSign
    domains: [docusign.com, docusign.net]
    labels: [docusign]
    aliases: [docusign]
  - name: LinkedIn
    domains: [linkedin.com]
    labels: [linkedin]
    aliases: [linkedin]
  - name: DHL
    domains: [dhl.com]
    labels: [dhl]
    aliases: [dhl]
  - name: FedEx
    domains: [fedex.com]
    labels: [fedex]
    aliases: [fedex]
  - name: UPS
    domains: [ups.com]
    labels: [ups]
    aliases: [ups]
  - name: Slack
    domains: [slack.com]
    labels: [slack]
    aliases: [slack]
  - name: Zoom
    domains: [zoom.us]
    labels: [zoom]
    aliases: [zoom]
  - name: GitHub
    domains: [github.com]
    labels: [github]
    aliases: [github]
  - name: Bank of America
    domains: [bankofamerica.com]
    labels: [bankofamerica]
    aliases: [bank of america]
  - name: Wells Fargo
    domains: [wellsfargo.com]
    labels: [wellsfargo]
    aliases: [wells fargo]
  - name: Chase
