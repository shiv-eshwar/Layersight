[project]
name = "layersight"
version = "0.1.0"
description = "Phishing triage and layered-defense analysis engine"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "idna>=3.10",
    "lxml>=5.3",
    "numpy>=2.1",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "rapidfuzz>=3.10",
    "rich>=13.9",
    "tldextract>=5.1",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = ["hypothesis>=6.122", "mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[project.scripts]
layersight = "layersight.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["layersight"]

[tool.hatch.build]
include = [
    "layersight/**/*.py",
    "layersight/**/*.yaml",
    "layersight/**/*.txt",
    "layersight/**/*.dat",
    "layersight/py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "validation: accuracy gate on the labeled corpora",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["layersight", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["layersight"]

[tool.ruff.lint.per-file-ignores]
"layersight/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["layersight"]
mypy_path = "."
exclude = ["examples\\.py"]

[[tool.mypy.overrides]]
module = ["bs4.*", "lxml.*", "rapidfuzz.*", "tldextract.*", "yaml.*"]
ignore_missing_imports = true
