[project]
name = "layersight-api"
version = "0.1.0"
description = "HTTP API for LayerSight. Analysis logic lives in the engine package."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "layersight",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
layersight = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
