name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check api engine/tests/test_contracts.py engine/tests/test_corpus.py engine/tests/test_reference.py engine/layersight/__init__.py engine/layersight/models.py engine/layersight/config/schema.py engine/layersight/refs.py
      - run: uv run ruff format --check api engine/tests/test_contracts.py engine/tests/test_corpus.py engine/tests/test_reference.py engine/layersight/__init__.py engine/layersight/models.py engine/layersight/config/schema.py engine/layersight/refs.py
      - run: uv run mypy
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec tsc --noEmit
        working-directory: web
      - run: pnpm exec eslint .
        working-directory: web
